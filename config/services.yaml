# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
  ignf_validator.path: '%env(resolve:VALIDATOR_PATH)%'
  # GML/PCRS validation - see config/gdal/README.md and https://github.com/IGNF/validator-api/issues/15
  env(GMLAS_CONFIG): '%kernel.project_dir%/config/gdal/gmlasconf-validator.xml'
  # local working directory of the validations
  validations_dir: '%env(resolve:DATA_DIR)%/validations'
  # max duration of validator-cli.jar in seconds (VALIDATOR_TIMEOUT)
  validator_timeout_default: 1800
  # storage of the uploaded and produced files : "local" (var/data) or "S3"
  env(STORAGE_TYPE): 'local'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $validationsDir: "%validations_dir%"
      $projectDir: "%kernel.project_dir%"
      $validatorPath: "%ignf_validator.path%"
      $validatorJavaOpts: "%env(resolve:VALIDATOR_JAVA_OPTS)%"
      $validatorTimeout: "%env(int:default:validator_timeout_default:VALIDATOR_TIMEOUT)%"
      $gmlasConfigPath: "%env(resolve:GMLAS_CONFIG)%"
      $dataDownloadEnabled: "%env(bool:DATA_DOWNLOAD_ENABLED)%"
      $modelAllowedHosts: "%env(VALIDATOR_MODEL_ALLOWED_HOSTS)%"
      $storageType: "%env(STORAGE_TYPE)%"
      $oidcEnabled: "%env(bool:OIDC_ENABLED)%"
      $oidcClientId: "%env(OIDC_CLIENT_ID)%"
      $oidcAdminRole: "%env(OIDC_ADMIN_ROLE)%"

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/Entity/"
      - "../src/Kernel.php"

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  # adds the client IP (X-Forwarded-For from TRUSTED_PROXIES), url, method and user agent to the logs
  Symfony\Bridge\Monolog\Processor\WebProcessor:
    arguments:
      $extraFields: { url: REQUEST_URI, ip: REMOTE_ADDR, http_method: REQUEST_METHOD, user_agent: HTTP_USER_AGENT }
    tags: [monolog.processor]

  # sessions of the users logged in with OIDC (see framework.session)
  Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
    arguments:
      - '%env(DATABASE_URL)%'

when@test:
  parameters:
    validations_dir: '%env(resolve:DATA_DIR)%/validations-test'
  services:
    # bearer tokens without Keycloak (see tests/Controller/Api/OidcAuthTest.php)
    App\Tests\Security\FakeAccessTokenHandler:
      decorates: security.access_token_handler.bearer
