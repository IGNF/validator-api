# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # session only used by the browser users logged in with OIDC (no session for anonymous and bearer requests),
    # stored in the database to be shared by the replicas (see the "sessions" table in migrations)
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        # expired sessions removed from the database on 1 % of the requests
        # (php.ini session.gc_probability is often 0, ex : Debian)
        gc_probability: 1
        gc_divisor: 100

    php_errors:
        log: true

    # reverse proxies (TRUSTED_PROXIES, ex : PRIVATE_SUBNETS) whose X-Forwarded-For is trusted to get the client IP (rate limiter, logs)
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

when@test:
    framework:
        test: true
        # sessions in files, without PdoSessionHandler : it uses DATABASE_URL without the "_test" suffix
        # (also used by the schema created by the tests, see PdoSessionHandlerSchemaListener)
        session:
            storage_factory_id: session.storage.factory.mock_file
            handler_id: ~
