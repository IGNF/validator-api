# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # stateless API (no session, no cookie)
    session: false

    php_errors:
        log: true

    # reverse proxies (TRUSTED_PROXIES, ex : PRIVATE_SUBNETS) whose X-Forwarded-For is trusted to get the client IP (rate limiter, logs)
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

when@test:
    framework:
        test: true
